name: rhythm
description: "Rhythm — la santé : sports, alimentation, habitudes, biblique."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  # Les habitudes : une base SQLite locale (dépôt repris de Studio / Net
  # Worth), les rappels (notifications planifiées), et l'appel d'un proche
  # depuis « J'ai une envie ».
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  # Les sports : l'écran reste allumé pendant une séance guidée ou une
  # sortie chronométrée.
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  # La base d'aliments, hors ligne : le Fichier canadien sur les éléments
  # nutritifs 2026 (Santé Canada, Licence du gouvernement ouvert – Canada),
  # réduit par `python tool/extraire_fcen.py <dossier des CSV>`.
  assets:
    - assets/donnees/fcen.txt

  # Les deux familles de la maquette (design/Rhythm.html), extraites de ses
  # WOFF2 par `python tool/extraire_polices.py` (SIL Open Font License,
  # textes dans assets/polices/). Bricolage Grotesque : titres, chiffres,
  # versets. DM Sans : texte courant. Toutes deux VARIABLES (wght + opsz) :
  # la graisse et la taille optique passent par `fontVariations`
  # (lib/theme/rhythm_typo.dart). Le même fichier est déclaré à chaque
  # graisse employée : sinon le moteur croit n'avoir qu'un 400 et épaissit
  # artificiellement un 600 déjà gras (leçon de Studio).
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/polices/BricolageGrotesque-Variable.ttf
          weight: 500
        - asset: assets/polices/BricolageGrotesque-Variable.ttf
          weight: 600
    - family: DMSans
      fonts:
        - asset: assets/polices/DMSans-Variable.ttf
          weight: 400
        - asset: assets/polices/DMSans-Variable.ttf
          weight: 500
        - asset: assets/polices/DMSans-Variable.ttf
          weight: 600

# Icône de l'app : `python tool/gen_icone.py` puis
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icone/icone.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icone/icone_avant_plan.png
  # Les barres de `icone_avant_plan.png` tiennent déjà dans la zone sûre :
  # pas de marge en plus (celle par défaut, 16 %, les rendait trop petites).
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icone/icone_monochrome.png
